[package]
name = "libskyrim"
version = "1.1.0"
edition = "2024"

[dependencies]
core-util = { path = "../core-util" }
cstd = { path = "../cstd" }
bitflags = "2.11.0"
bytemuck = { version = "1.25.0", features = ["derive"] }

[features]
# Build the default cross-runtime plugin surface for SE and AE.
default = ["se", "ae"]

# Runtime selection flags.
se = []
ae = []
vr = []

# Opt-in default panic handler for final no_std plugin crates.
panic-handler = []

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
]

[build-dependencies]
xmake = "0.3.3"
